# Host Nginx snippet: /etc/nginx/snippets/wechat-relay.conf.
# Uses the host's systemd-resolved stub, not Docker's DNS resolver.
location ^~ /wechat-relay/ {
    auth_basic "WeChat API Relay";
    auth_basic_user_file /etc/nginx/wechat-relay.htpasswd;

    # Keep AppSecret and access_token out of logs.
    access_log off;
    error_log /dev/null crit;

    client_max_body_size 25m;

    # Resolve at request time so a DNS outage cannot prevent Nginx startup.
    resolver 127.0.0.53 valid=60s ipv6=off;
    resolver_timeout 5s;
    set $wechat_relay_host api.weixin.qq.com;
    rewrite ^/wechat-relay/(.*)$ /$1 break;
    proxy_pass https://$wechat_relay_host;
    proxy_redirect https://api.weixin.qq.com/ /wechat-relay/;
    proxy_http_version 1.1;

    proxy_set_header Host api.weixin.qq.com;
    proxy_set_header Authorization "";
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";

    proxy_ssl_server_name on;
    proxy_ssl_name api.weixin.qq.com;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth 3;

    proxy_connect_timeout 15s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    proxy_request_buffering on;
    proxy_buffering off;
}
