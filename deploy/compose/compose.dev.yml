name: wechat-ai-dev

x-backend: &backend
  build:
    context: ../../services/platform-backend
    target: development
  env_file:
    - path: ../../.env.example
      required: true
    - path: ../../.env
      required: false
  environment:
    PYTHONPATH: /app
    UV_NO_SYNC: "1"
  volumes:
    - ../../services/platform-backend:/app
  depends_on:
    business-db:
      condition: service_healthy
    retrieval-db:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "9000:80"
    volumes:
      - ../gateway/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - user-web
      - admin-web
      - backend-api
    restart: unless-stopped

  user-web:
    build:
      context: ../../apps/user-client
      target: development
    environment:
      PORT: "9000"
      VITE_API_BASE_URL: /api/v1
      DEV_API_PROXY_TARGET: http://backend-api:8000
      VITE_APP_ENV: development
    volumes:
      - ../../apps/user-client:/app
      - user-node-modules:/app/node_modules
      - user-capacitor-node-modules:/app/src-capacitor/node_modules
    expose:
      - "9000"
    restart: unless-stopped

  admin-web:
    build:
      context: ../../apps/admin-console
      target: development
    environment:
      CI: "true"
      PORT: "9000"
      VITE_ADMIN_API_BASE: /admin-api/v1
      DEV_API_PROXY_TARGET: http://backend-api:8000
      VITE_APP_ENV: development
      VITE_BASE_PATH: /admin/
    volumes:
      - ../../apps/admin-console:/app
      - admin-node-modules:/app/node_modules
    expose:
      - "9000"
    restart: unless-stopped

  backend-api:
    <<: *backend
    command: /bin/sh -ec "uv run alembic upgrade head && uv run python scripts/migrate_retrieval.py && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"

  worker-ai:
    <<: *backend
    command: uv run celery -A app.celery_app:celery worker --loglevel=INFO --queues=ai --concurrency=2

  worker-parser:
    <<: *backend
    command: uv run celery -A app.celery_app:celery worker --loglevel=INFO --queues=files --concurrency=2
    depends_on:
      business-db:
        condition: service_healthy
      retrieval-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy

  worker-embedding:
    <<: *backend
    command: uv run celery -A app.celery_app:celery worker --loglevel=INFO --queues=embedding --concurrency=2

  worker-wechat:
    <<: *backend
    command: uv run celery -A app.celery_app:celery worker --loglevel=INFO --queues=wechat --concurrency=2

  worker-sync:
    <<: *backend
    command: uv run celery -A app.celery_app:celery worker --loglevel=INFO --queues=sync,maintenance --concurrency=1

  scheduler:
    <<: *backend
    command: uv run celery -A app.celery_app:celery beat --loglevel=INFO

  business-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${BUSINESS_DB_NAME:-wechat_ai}
      POSTGRES_USER: ${BUSINESS_DB_USER:-wechat_ai}
      POSTGRES_PASSWORD: ${BUSINESS_DB_PASSWORD:-change-this-development-password}
    ports:
      - "5432:5432"
    volumes:
      - business-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  retrieval-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${RETRIEVAL_DB_NAME:-wechat_ai_retrieval}
      POSTGRES_USER: ${RETRIEVAL_DB_USER:-wechat_ai}
      POSTGRES_PASSWORD: ${RETRIEVAL_DB_PASSWORD:-change-this-development-password}
    ports:
      - "5433:5432"
    volumes:
      - retrieval-db-data:/var/lib/postgresql/data
      - ../../services/platform-backend/retrieval-schema.sql:/docker-entrypoint-initdb.d/001-retrieval.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-wechat_ai}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change-this-development-password}
      RABBITMQ_DEFAULT_VHOST: wechat_ai
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-wechat_ai_dev}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change-this-development-secret}
    ports:
      - "9002:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}"
        mc mb --ignore-existing "local/$${S3_BUCKET_QUARANTINE}"
        mc mb --ignore-existing "local/$${S3_BUCKET_PRIVATE}"
        mc anonymous set none "local/$${S3_BUCKET_QUARANTINE}"
        mc anonymous set none "local/$${S3_BUCKET_PRIVATE}"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-wechat_ai_dev}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-this-development-secret}
      S3_BUCKET_QUARANTINE: ${S3_BUCKET_QUARANTINE:-wechat-ai-quarantine}
      S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE:-wechat-ai-private}

  clamav:
    image: clamav/clamav:1.4
    ports:
      - "3310:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 10
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.126.0
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ../monitoring/otel-collector.yml:/etc/otelcol/config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    profiles: ["monitoring"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.4.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    profiles: ["monitoring"]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.1
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ../monitoring/loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    profiles: ["monitoring"]
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.8.1
    command: ["-config.file=/etc/tempo/config.yml"]
    volumes:
      - ../monitoring/tempo.yml:/etc/tempo/config.yml:ro
      - tempo-data:/var/tempo
    profiles: ["monitoring"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-this-development-password}
    volumes:
      - ../monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/default.yml:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    profiles: ["monitoring"]
    restart: unless-stopped

volumes:
  user-node-modules:
  user-capacitor-node-modules:
  admin-node-modules:
  business-db-data:
  retrieval-db-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  clamav-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
