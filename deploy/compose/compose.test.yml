name: wechat-ai-test

services:
  business-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wechat_ai_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test-only-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d wechat_ai_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  retrieval-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: wechat_ai_retrieval_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test-only-password
    volumes:
      - ../../services/platform-backend/retrieval-schema.sql:/docker-entrypoint-initdb.d/001-retrieval.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d wechat_ai_retrieval_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-alpine
    environment:
      RABBITMQ_DEFAULT_USER: test
      RABBITMQ_DEFAULT_PASS: test-only-password
      RABBITMQ_DEFAULT_VHOST: wechat_ai_test
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  suite-tests:
    build:
      context: ../../services/platform-backend
      target: test
    environment:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://test:test-only-password@business-db:5432/wechat_ai_test
      RETRIEVAL_DATABASE_URL: postgresql+asyncpg://test:test-only-password@retrieval-db:5432/wechat_ai_retrieval_test
      CELERY_BROKER_URL: amqp://test:test-only-password@rabbitmq:5672/wechat_ai_test
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      TOKEN_SECRET: test-secret-that-is-long-enough-for-tests
      MODEL_SECRET_MASTER_KEY: test-model-secret-that-is-long-enough
      COOKIE_SECURE: "false"
      AUTO_CREATE_SCHEMA: "false"
      WECHAT_PROVIDER_MODE: direct
      ALLOWED_ORIGINS: http://localhost:9000
    command: /bin/sh -ec "uv run alembic upgrade head && uv run python scripts/migrate_retrieval.py && uv run pytest"
    depends_on:
      business-db:
        condition: service_healthy
      retrieval-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
