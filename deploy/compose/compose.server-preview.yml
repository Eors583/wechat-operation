name: wechat-ai-preview

x-backend: &backend
  image: wechat-ai-backend:${APP_VERSION:-preview}
  build:
    context: ../../services/platform-backend
    target: runtime
  env_file:
    - path: ../../.env.server
      required: true
  environment:
    PYTHONPATH: /app
    UV_NO_SYNC: "1"
  depends_on:
    business-db:
      condition: service_healthy
    retrieval-db:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${PREVIEW_PORT:-19000}:80"
    volumes:
      - ../gateway/nginx.demo.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - user-web
      - admin-web
      - backend-api
    mem_limit: 64m
    restart: unless-stopped

  user-web:
    image: wechat-ai-user:${APP_VERSION:-preview}
    build:
      context: ../../apps/user-client
      target: production
    mem_limit: 64m
    restart: unless-stopped

  admin-web:
    image: wechat-ai-admin:${APP_VERSION:-preview}
    build:
      context: ../../apps/admin-console
      target: production
    mem_limit: 64m
    restart: unless-stopped

  backend-api:
    <<: *backend
    command: >-
      /bin/sh -ec "uv run alembic upgrade head &&
      uv run python scripts/migrate_retrieval.py &&
      uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"
    mem_limit: 384m

  worker:
    <<: *backend
    command: >-
      uv run celery -A app.celery_app:celery worker --loglevel=INFO
      --queues=ai,files,embedding,wechat,sync,maintenance --concurrency=1
    mem_limit: 512m

  business-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${BUSINESS_DB_NAME}
      POSTGRES_USER: ${BUSINESS_DB_USER}
      POSTGRES_PASSWORD: ${BUSINESS_DB_PASSWORD}
    volumes:
      - business-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 192m
    restart: unless-stopped

  retrieval-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${RETRIEVAL_DB_NAME}
      POSTGRES_USER: ${RETRIEVAL_DB_USER}
      POSTGRES_PASSWORD: ${RETRIEVAL_DB_PASSWORD}
    volumes:
      - retrieval-db-data:/var/lib/postgresql/data
      - ../../services/platform-backend/retrieval-schema.sql:/docker-entrypoint-initdb.d/001-retrieval.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 192m
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 96m
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: wechat_ai_preview
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 256m
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 192m
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}"
        mc mb --ignore-existing "local/$${S3_BUCKET_QUARANTINE}"
        mc mb --ignore-existing "local/$${S3_BUCKET_PRIVATE}"
        mc anonymous set none "local/$${S3_BUCKET_QUARANTINE}"
        mc anonymous set none "local/$${S3_BUCKET_PRIVATE}"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_QUARANTINE: ${S3_BUCKET_QUARANTINE:-wechat-ai-preview-quarantine}
      S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE:-wechat-ai-preview-private}
    mem_limit: 96m

volumes:
  business-db-data:
  retrieval-db-data:
  redis-data:
  rabbitmq-data:
  minio-data:
