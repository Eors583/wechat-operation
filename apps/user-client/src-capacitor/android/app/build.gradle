apply plugin: 'com.android.application'

def oauthRedirectHost = project.findProperty('oauthRedirectHost') ?: System.getenv('WECHAT_AI_OAUTH_HOST') ?: 'app.example.invalid'
def nativeOauthRedirect = System.getenv('VITE_OAUTH_REDIRECT_URI_NATIVE') ?: ''
def nativeApiBaseUrl = System.getenv('WECHAT_AI_API_BASE_URL') ?: 'https://api.example.invalid/api/v1'
def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }

if (releaseRequested) {
    def apiUrl = new URI(nativeApiBaseUrl)
    def callbackUrl = new URI(nativeOauthRedirect)
    if (apiUrl.scheme != 'https' || !apiUrl.host || apiUrl.userInfo || apiUrl.query || apiUrl.fragment || apiUrl.host.endsWith('.invalid')) {
        throw new GradleException('Release NativeAuth API must be a formal credential-free HTTPS URL.')
    }
    if (callbackUrl.scheme != 'https' || !callbackUrl.host || callbackUrl.userInfo || callbackUrl.query || callbackUrl.fragment || callbackUrl.host.endsWith('.invalid') || !(callbackUrl.path == '/official-accounts' || callbackUrl.path.startsWith('/official-accounts/'))) {
        throw new GradleException('Release OAuth callback must be a formal HTTPS /official-accounts URL.')
    }
    if (oauthRedirectHost != callbackUrl.host) {
        throw new GradleException('WECHAT_AI_OAUTH_HOST must exactly match VITE_OAUTH_REDIRECT_URI_NATIVE hostname.')
    }
}

android {
    namespace = "com.wechat.ai.operations"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.wechat.ai.operations"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
        manifestPlaceholders = [oauthRedirectHost: oauthRedirectHost]
        buildConfigField "String", "WECHAT_AI_API_BASE_URL", "\"${nativeApiBaseUrl.replace('\\', '\\\\').replace('\"', '\\\"')}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig true
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
